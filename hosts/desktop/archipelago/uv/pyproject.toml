[project]
name = "archipelago"
version = "0.6.8"
requires-python = ">=3.13"
dependencies = [
    "colorama==0.4.6",
    "websockets==13.1",
    "PyYAML==6.0.3",
    "jellyfish==1.2.1",
    "jinja2==3.1.6",
    "schema==0.7.8",
    "kivy==2.3.1",
    "bsdiff4==1.2.6",
    "platformdirs==4.10.1",
    "certifi==2026.2.25",
    "cython==3.2.4",
    "cymem==2.0.13",
    "orjson==3.11.7",
    "typing_extensions==4.15.0",
    "pyshortcuts==1.9.7",
    "pathspec==1.0.4",
    "kivymd @ git+https://github.com/kivymd/KivyMD@5ff9d0d",
    "kivymd>=2.0.1.dev0",
    "Pymem==1.14.0",
    "flask==3.1.3",
    "werkzeug==3.1.6",
    "pony==0.7.19; python_version <= '3.12'",
    "pony @ git+https://github.com/black-sliver/pony@7feb1221953b7fa4a6735466bf21a8b4d35e33ba#0.7.19; python_version >= '3.13'",
    "waitress==3.0.2",
    "Flask-Caching==2.3.1",
    "Flask-Compress==1.18",
    "Flask-Limiter==4.1.1",
    "Flask-Cors==6.0.2",
    "bokeh==3.8.2",
    "markupsafe==3.0.3",
    "setproctitle==1.3.7",
    "mistune==3.3.0",
    "docutils==0.22.4",
    "psutil==7.2.2",
    "mpyq>=0.2.5",
    "portpicker>=1.5.2",
    "aiohttp>=3.8.4",
    "loguru>=0.7.0",
    "protobuf==6.33.5",
    "maseya-z3pr==1.0.0rc1",
    "xxtea==3.7.0",
    "factorio-rcon-py==2.1.3",
    "PyMemoryEditor>=2.0.1",
    "Pymem>=1.10.0",
    "nest-asyncio >= 1.5.5",
    "pyevermizer==0.50.1",
    "bsdiff4>=1.2.2",
    "dolphin-memory-engine>=1.3.0",
    "zilliandomizer @ git+https://github.com/beauxq/zilliandomizer@96d9a20f8278cee64bb4db859fbd874e0f332d36#0.9.1",
    "typing-extensions>=4.7, <5",
]

[tool.uv]
package = false

# The git deps (kivymd, pony fork, zilliandomizer) declare no [build-system]
# Source-built packages (no usable wheel for cp313 x86_64) need
# setuptools in uv's isolated build env.
[tool.uv.extra-build-dependencies]
brotlicffi = ["setuptools"]
dolphin-memory-engine = ["setuptools"]
kivy-deps-angle = ["setuptools"]
kivy-deps-glew = ["setuptools"]
kivy-deps-sdl2 = ["setuptools"]
kivymd = ["setuptools"]
mpyq = ["setuptools"]
pony = ["setuptools"]
pywin32 = ["setuptools"]
tornado = ["setuptools"]
zilliandomizer = ["setuptools"]
