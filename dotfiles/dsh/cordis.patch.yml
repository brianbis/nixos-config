# dsh web profile patch layer, installed by home-manager as a plain file
# (not a symlink): dsh watches it at runtime and creates it only when missing,
# so the installed file is owned by this activation.
#
# Disable the model-settings plugin: its welcome-notice acknowledgement is
# process-local over a non-loopback trusted host (so it reappears on every
# blank session), and its Models page is redundant (routes are in dshSettings).
- id: ui-settings-models
  disabled: true

# Web search uses the self-hosted SearXNG provider (an out-of-tree plugin
# mounted by relative module name) instead of DeepSeek's hosted tool; the
# `web` row pins it as the selected backend and fetch stays disabled. The
# patch engine replaces a row's whole `config`, so restate `fetchProvider`
# (added to the base row in 0.1.2) or it reverts to the plugin default.
- id: web
  config:
    searchProvider: searxng
    fetchProvider: http

# The provider row is NEW, so it must be added with `insert`: the patch
# engine only targets rows that already exist by id, and a bare patch for an
# unknown id is silently skipped (leaving searchProvider dangling).
- insert:
    - id: web-search-searxng
      name: "./searxng-search-provider.mjs"
      config:
        baseUrl: "http://127.0.0.1:8888"

- id: tool-web
  config:
    search: true
    fetch: false

# Disable the bundled DeepSeek search provider so the harness never calls
# the DeepSeek search API (api.deepseek.com) regardless of the chat model.
- id: web-search-deepseek
  disabled: true

# knife: a reverse engineer's binary Swiss-army knife (PE/ELF/Mach-O). Its
# built-in `knife mcp` stdio server exposes the analysis engine as MCP tools
# (open/info/triage/audit/decompile/...). Static analysis only — it never runs
# the target, which is what makes it safe to point at malware. `knife` is on the
# jail PATH (home/llm/jails.nix commonPkgSpecs), so the bare command resolves.
# The agent binds a target with the `open` tool, so no --file is needed here.
- insert:
    - id: mcp-knife
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: knife
        transport: stdio
        command: knife
        args: [mcp]
        cwd: !!js process.cwd()

# graphify: codebase -> knowledge graph (Graphify-Labs/graphify). Its built-in
# `graphify-mcp` stdio server exposes the graph query tools (query / path /
# explain / god nodes / communities). It serves a BUILT graph, so the agent
# builds the graph first (`graphify <project>`) and the dsh-mcp-client's
# auto-reconnect brings the tools up once the graph exists. `graphify-mcp` is
# on the jail PATH (home/llm/jails.nix commonPkgSpecs), so the bare command
# resolves.
#
# The graph path is passed ABSOLUTELY (not the default `graphify-out/graph.json`
# relative to cwd) because the MCP server's process cwd is `/`: the dsh-web
# service (hosts/desktop/dsh-web.nix) sets no WorkingDirectory, so systemd
# defaults it to `/` and `!!js process.cwd()` below evaluates to `/`. The agent
# builds the graph into the agent home ($HOME/graphify-out/), a stable location
# this static profile can point at.
- insert:
    - id: mcp-graphify
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: graphify
        transport: stdio
        command: graphify-mcp
        args: ["/home/llm/graphify-out/graph.json"]
        cwd: !!js process.cwd()

# graphlore: richer third-party MCP server (28 tools) that wraps graphify's
# knowledge graph (span engine, semantic locate, impact/blast-radius, freshness).
# It starts without a pre-built graph (tools load it lazily; `graphlore_build`
# shells out to the `graphify` CLI on the jail PATH) and serves the project at
# GRAPHLORE_PROJECT_DIR.
#
# GRAPHLORE_PROJECT_DIR is the AGENT HOME (not the session CWD): the dsh-web
# service sets no WorkingDirectory, so the MCP's process cwd is `/` and
# `!!js process.cwd()` would evaluate to `/` (no graph there). The agent builds
# the graph into $HOME/graphify-out/, so pointing the project dir at the agent
# home makes graphlore find it. (The source-based tools — locate/fetch/skeleton —
# additionally need the source under the project dir; for those, build the graph
# inside the project being analyzed.)
- insert:
    - id: mcp-graphlore
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: graphlore
        transport: stdio
        command: graphlore
        args: []
        cwd: /home/llm
        env:
          GRAPHLORE_PROJECT_DIR: /home/llm

# ripwire: "the ripgrep of AI context" (redhat-et/ripwire): a zero-dependency
# C++23 CLI + stdio MCP server that builds a ranked symbol/call graph
# (Personalized PageRank) of a directory and serves ~100 read verbs (ranked
# map, task lens, callers/callees/impact, pre-PR review bundles, quality
# tracking, atomic edits, lint, evals). `ripwire` is on the jail PATH
# (home/llm/jails.nix commonPkgSpecs), so the bare command resolves.
#
# Launched WITHOUT a directory (`ripwire --mcp`): both launch forms work
# (verified — 33 tools each), but the dir-less form is the general one: every
# tool carries its own required `path` argument, so one server serves any repo
# the agent works in instead of pinning the index to a single directory. The
# initialize result carries an `instructions` block with the workflow guidance.
- insert:
    - id: mcp-ripwire
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: ripwire
        transport: stdio
        command: ripwire
        args: ["--mcp"]
        cwd: !!js process.cwd()
