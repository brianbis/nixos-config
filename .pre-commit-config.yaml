# Declarative formatting for this repo.
#
# Run with `just fmt`. Whitespace rules come from the maintained
# pre-commit/pre-commit-hooks; language formatters run as system hooks,
# pinned to the flake apps ($NIXPKGS fallback — set system-wide by
# hosts/desktop/host.nix and per session by the jails) so versions track
# the flake instead of a floating registry default.
#
# The `just fmt` wrapper (`nix shell nixpkgs#pre-commit nixpkgs#nix`)
# matters: pre-commit's hooks run in the nix daemon's mount namespace,
# where only the daemon's store is visible — the nix client must be one of
# the shell's packages for the `nix run` entries below to resolve.
#
# *.patch / *.diff are excluded from the whitespace hooks: in a unified
# diff the first column is semantic (context/add/delete markers) and the
# space on an "empty" context line is canonical, not a defect.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # .age files are base64: never touch line interiors.
        exclude: \.(patch|diff|age)$
      - id: end-of-file-fixer
        # .age files are binary ciphertext: their final byte is payload data,
        # not a trailing newline — never touch them.
        exclude: \.(patch|diff|age)$
      - id: mixed-line-ending
      # v6: check-utf8 was replaced by fix-byte-order-marker (strips BOMs).
      - id: fix-byte-order-marker

  - repo: local
    hooks:
      # system hooks run without a shell, so each entry wraps its command
      # in `sh -c` to expand $NIXPKGS; pre-commit appends the file list
      # after the entry, which lands in "$@".
      - id: nixpkgs-fmt
        name: nixpkgs-fmt (Nix)
        entry: sh -c 'exec nix run .#nixpkgs-fmt -- "$@"' sh
        language: system
        files: \.nix$

      - id: black
        name: black (Python)
        entry: sh -c 'exec nix run .#black -- "$@"' sh
        language: system
        files: \.py$

      - id: prettier
        name: prettier (CSS/JS/JSON/YAML)
        entry: sh -c 'exec nix run .#prettier -- --write "$@"' sh
        language: system
        files: \.(css|js|mjs|json|yml|yaml)$
        # flake.lock is generated by `nix flake update`.
        exclude: (^|/)flake\.lock$

      - id: shfmt
        name: shfmt (shell)
        entry: sh -c 'exec nix run .#shfmt -- -i 2 -w "$@"' sh
        language: system
        files: \.sh$

      - id: yamllint
        name: yamllint (YAML, relaxed)
        # Config comes from .yamllint in the repo root (auto-discovered).
        entry: sh -c 'exec nix run .#yamllint -- --strict "$@"' sh
        language: system
        files: \.(yml|yaml)$

      - id: markdownlint
        name: markdownlint-fix (Markdown)
        entry: sh -c 'exec nix run .#markdownlint-cli2 -- "$@"' sh
        language: system
        files: \.md$
        # AGENTS.md is generated by `just switch` from agents-gen/.
        exclude: ^AGENTS\.md$
